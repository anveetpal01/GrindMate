# Postgres + Redis for local development.
# Django and Vite run on the host for fast reload.
# Bring up:    docker compose up -d
# Tear down:   docker compose down
# Wipe data:   docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: grindmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grindmate
      POSTGRES_USER: grindmate
      POSTGRES_PASSWORD: grindmate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grindmate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grindmate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
