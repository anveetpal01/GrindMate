name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: grindmate
          POSTGRES_USER: grindmate
          POSTGRES_PASSWORD: grindmate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grindmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: grindmate.settings.test
      DATABASE_URL: postgres://grindmate:grindmate@localhost:5432/grindmate
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-pipeline-secret-not-for-production-use-at-least-50-chars-long-xyz
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install -r requirements/prod.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Migrate (sanity)
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Django deploy check
        env:
          DJANGO_SETTINGS_MODULE: grindmate.settings.production
          DJANGO_ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          CORS_ALLOWED_ORIGINS: https://example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend - lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
