# Render Blueprint - defines the web service for the Django backend.
# Connect this repo to Render and Render will read this file to provision
# the service. Database (Neon) and cache (Upstash) live outside Render -
# their connection URLs go in as env vars.
#
# What this gives you on the free plan:
#   - 1 web service (Django + Gunicorn)
#   - HTTPS subdomain on *.onrender.com
#   - 750 hours/month (basically always-on, but spins down after 15min idle)
#
# What it does NOT give you (free tier limits):
#   - No Celery worker process (use the GitHub Actions cron instead)
#   - No private networking (Postgres + Redis are public-internet hosted)

services:
  - type: web
    name: grindmate-api
    runtime: python
    region: singapore  # closest to India for the user's friends
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements/prod.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn grindmate.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: grindmate.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true            # Render auto-generates a strong secret
      - key: DJANGO_ALLOWED_HOSTS
        sync: false                    # set in dashboard: <your-app>.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false                    # set in dashboard: https://<vercel-url>
      - key: CORS_ALLOWED_ORIGINS
        sync: false                    # set in dashboard: https://<vercel-url>
      - key: FRONTEND_URL
        sync: false                    # set in dashboard: https://<vercel-url>
      - key: DATABASE_URL
        sync: false                    # paste Neon connection string here
      - key: REDIS_URL
        sync: false                    # optional: Upstash URL, otherwise leave blank
      - key: CRON_SHARED_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false                    # optional: paste from sentry.io
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false                    # set in dashboard: your Gmail address
      - key: EMAIL_HOST_PASSWORD
        sync: false                    # set in dashboard: 16-char Gmail App Password
      - key: DEFAULT_FROM_EMAIL
        sync: false                    # e.g. 'GrindMate <your-gmail@gmail.com>'
